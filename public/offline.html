<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <link rel="icon" href="/progressive-olive-32.png" type="image/png" />
    <title>Offline · Progressive</title>
    <style>
      body {
        margin: 0;
        background: #f5f2eb;
        color: #292d28;
        font:
          16px/1.6 Arial,
          sans-serif;
      }
      main {
        max-width: 440px;
        margin: 15vh auto;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: #686a60;
      }
      a {
        display: inline-block;
        background: #4c5c3e;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #71865a;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/progressive-olive-192.png" width="38" height="38" alt="" />
        Progressive
      </div>
      <h1>You’re offline.</h1>
      <p>
        Reconnect to load your account. Any set drafts kept on this device will
        be available when you reopen your workout.
      </p>
      <a href="/workout">Try again</a>
    </main>
  </body>
</html>
