<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f2eb" />
    <link rel="icon" href="/progressive-olive-32.png" type="image/png" />
    <title>Offline · Progressive</title>
    <style>
      body {
        margin: 0;
        background: #f5f2eb;
        color: #292d28;
        font:
          16px/1.6 Arial,
          sans-serif;
      }
      main {
        max-width: 440px;
        margin: 4vh auto;
        padding: 24px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      p {
        color: #686a60;
      }
      a,
      button {
        display: inline-block;
        background: #4c5c3e;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        text-decoration: none;
      }
      button {
        border: 0;
        cursor: pointer;
        font: inherit;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      section {
        background: #fffcf7;
        border: 1px solid #ded9ce;
        border-radius: 12px;
        padding: 16px;
        margin: 14px 0;
      }
      section h2 {
        font-size: 20px;
        margin: 0;
      }
      form,
      label {
        display: grid;
        gap: 8px;
        margin-top: 8px;
      }
      input,
      textarea,
      select {
        box-sizing: border-box;
        min-width: 0;
        width: 100%;
        font: inherit;
        padding: 9px;
        border-radius: 6px;
        border: 1px solid #949486;
      }
      .secondary {
        color: #292d28;
        background: #e9e5da;
        padding: 8px 12px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 8px 0;
      }
      #status {
        min-height: 1.6em;
      }
      a:focus-visible {
        outline: 3px solid #71865a;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/progressive-olive-192.png" width="38" height="38" alt="" />
        Progressive
      </div>
      <h1 id="title">Offline workouts</h1>
      <p id="description">
        Download a training day from Workout while connected to use it here.
      </p>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="session"></div>
      <a href="/workout">Back to Workout</a>
    </main>
    <script defer src="/offline-workout.js"></script>
  </body>
</html>
